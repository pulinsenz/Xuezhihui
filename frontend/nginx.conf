# 学智汇 前端 Nginx 站点配置（作为 /etc/nginx/conf.d/default.conf 挂载）
# 职责：托管 Vite 静态产物 + 将 /api/* 同源反代到 Java（context-path=/api）
# 域名：xuezhihui.site / www.xuezhihui.site（HTTPS 已启用，Let's Encrypt SAN 证书）
# 三条铁律：
#   1) /api/ 反代的 proxy_pass 不带 URI（无尾斜杠）→ 保留原始完整路径，不会把 /api 拼重复
#   2) SSE /api/chat/stream：必须 proxy_buffering off + HTTP/1.1 + 清空 Connection 头
#   3) client_max_body_size 必须 > 后端 multipart 10MB，否则上传文档被 413
#
# ───────── HTTPS ─────────
#   证书：Let's Encrypt（acme.sh webroot 签发，SAN 覆盖 apex + www）
#   签发/安装/自动续期：bash scripts/enable-https.sh（幂等，服务器上执行）
#   80 段仅保留 ACME 校验应答与 /healthz 探针，页面请求一律 301 到 https
# ─────────────────────────────────────────────────────────────────────────

# ---------- 80 段：ACME 校验 + 探活 + 强制跳转 ----------
server {
    listen 80;
    server_name xuezhihui.site www.xuezhihui.site;

    # 上传上限对齐后端 10MB（默认 1MB 会 413）
    client_max_body_size 20m;

    # ACME HTTP-01 校验目录（Let's Encrypt / acme.sh 签证书用；宿主 /var/www/acme-challenge 与容器共享。
    # 必须用 root 而非 alias：acme.sh --webroot /var/www/acme-challenge 会写到
    #   /var/www/acme-challenge/.well-known/acme-challenge/TOKEN，root 拼接 URI 恰好对上。签发后可不删）
    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
        default_type text/plain;
    }

    # 健康检查探针（compose healthcheck 从容器内 wget 127.0.0.1:80/healthz，必须留在 80）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # 其余页面请求一律 301 到 https
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443 段：正式服务 ----------
server {
    listen 443 ssl;
    server_name xuezhihui.site www.xuezhihui.site;
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # 上传上限对齐后端 10MB（默认 1MB 会 413）
    client_max_body_size 20m;

    # 安全响应头（HSTS 提示浏览器强制 HTTPS）
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 健康检查探针（80 段同名 location 供容器内探活；本块供 443 侧 LB/外部探测）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # ---------- gzip ----------
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # ---------- 静态资源缓存 ----------
    # Vite 产物文件名带内容哈希 → 长缓存 immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # index.html 永不缓存：SPA fallback 也命中本块，保证发布后新壳即时生效
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }
    # 根级 favicon（public/ 下的非哈希文件）短缓存
    location = /vite.svg {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- API 反代（含 SSE）----------
    # proxy_pass 不带尾斜杠/URI → nginx 保留浏览器原始完整 URI 透传：
    # 浏览器 /api/chat/stream → Java 收到 /api/chat/stream（其 context-path=/api 正确解出 /chat/stream）
    # 若写成 proxy_pass http://java-backend:8123/; 会把 /api 前缀剥成 /chat/stream，Java 404。
    #
    # Docker DNS 缓存坑：proxy_pass 直接写服务名时 nginx 只在启动时解析一次并缓存 IP。
    # 一旦 java-backend 容器重建（IP 变化），nginx 仍指向旧 IP → connect() Host is unreachable → 502。
    # 解法：用 resolver 127.0.0.11（Docker 内置 DNS）+ 变量，让 nginx 每次请求动态解析服务名，
    # 容器重建后无需重启 nginx。resolver 在 http 上下文声明一次，这里用 local 变量保持可读。
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $java_upstream http://java-backend:8123;
        proxy_pass $java_upstream;
        proxy_http_version 1.1;

        # ---- SSE 关键：关缓冲 + 超时对齐 + 1.1 长连 ----
        proxy_buffering off;
        proxy_cache off;
        # 360s 略大于 Java SseEmitter(300_000L)，避免 nginx 先于应用掐断造成竞态丢流
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_connect_timeout 5s;

        # HTTP/1.1 上行 keep-alive 必需：清空 Connection 头
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 告知下游（CDN/浏览器）不要缓冲/缓存流式响应
        add_header X-Accel-Buffering no;
    }

    # ---------- SPA history 路由回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
