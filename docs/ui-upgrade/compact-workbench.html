<style>

*{box-sizing:border-box}body{margin:0;color:var(--t1);font:var(--text-body)/1.5 Inter,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-variant-numeric:tabular-nums}h1,h2,h3,p{margin:0}h1,h2{font-size:var(--text-heading)}h3{font-size:var(--text-body)}a{color:inherit;text-decoration:none}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.muted{color:var(--t3);font-size:var(--text-muted)}.grow{flex:1;min-width:0}.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stack{display:grid;gap:14px}.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.end{justify-content:flex-end}.shell{display:grid;grid-template-columns:200px minmax(0,1240px);gap:24px;max-width:1504px;margin:16px auto;padding-inline:20px;align-items:start}.sidebar,.card,.tablebox{background:var(--card);border-radius:var(--r1);box-shadow:var(--shadow-card)}.sidebar{position:sticky;top:16px;padding:12px 10px}.logo{padding:4px 8px 12px;font-weight:750;font-size:var(--text-heading)}.mark,.avatar{display:grid;place-items:center;width:32px;height:32px;border-radius:var(--r3);background:var(--tint);color:var(--brand);flex:none}.mark.solid{background:var(--brand);color:var(--card)}.group{margin:12px 8px 5px}.navlist{display:grid;gap:3px}.nav{position:relative;display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:8px;height:38px;padding:0 8px;border-radius:var(--r3);color:var(--t2);white-space:nowrap}.nav svg{justify-self:center}.nav:hover,.listlink:hover,.shortcut:hover{background:var(--bg)}.nav[aria-current]{background:var(--tint);color:var(--brand);font-weight:700}.nav[aria-current]:before{content:'';position:absolute;inset:9px auto 9px 0;width:2px;background:var(--brand);border-radius:var(--r3)}.count,.pill{display:inline-flex;align-items:center;justify-content:center;padding:2px 8px;border-radius:var(--r3);background:var(--tint);color:var(--brand);font-size:var(--text-muted);white-space:nowrap}.count{padding:0 5px;min-width:19px}.pill.neutral{background:var(--bg);color:var(--t2)}.pill.danger{background:var(--danger-bg);color:var(--danger)}.sidefoot{border-top:1px solid var(--line);margin-top:14px;padding:10px 8px 2px}.main{min-width:0}.top{margin-bottom:14px;min-height:36px}.crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.link{color:var(--brand);font-weight:650;font-size:var(--text-muted);white-space:nowrap}.link:hover{text-decoration:underline}.card{padding:16px}.welcome{background:var(--tint);box-shadow:none}.stamp{text-align:right;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{padding:12px;display:flex;align-items:center;justify-content:space-between;gap:6px}.metric strong{display:block;font-size:var(--text-num);line-height:1.14}.shortcuts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.shortcut{padding:7px;border:1px solid var(--line);border-radius:var(--r2);font-weight:650}.shortcut>svg:last-child,.chevron{width:14px;height:14px;color:var(--t3)}.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}.sectionhead{margin-bottom:8px}.listlink{display:grid;grid-template-columns:minmax(0,1fr) auto 14px;align-items:center;gap:9px;padding:9px 4px;border-radius:var(--r3);border-bottom:1px solid var(--line)}.listlink:last-child{border-bottom:none}.listlink strong{display:block}.right{text-align:right;white-space:nowrap}.gridcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.kbcard{display:grid;gap:9px}.kbcard p{color:var(--t2);min-height:3em}.kbcard .foot{border-top:1px solid var(--line);padding-top:9px}.kbcard .mark{width:38px;height:38px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:0 11px;border:1px solid var(--line);border-radius:var(--r3);background:var(--card);gap:5px;white-space:nowrap;text-decoration:none}.btn:hover:not(:disabled){background:var(--bg)}.btn svg{width:15px;height:15px}.btn.primary{color:var(--card);background:var(--brand);border-color:var(--brand)}.btn.primary:hover{background:var(--brand-hover)}.btn.primary:active{background:var(--brand-pressed)}.btn[aria-pressed="true"]{background:var(--tint);color:var(--brand);border-color:var(--tint-strong)}.btn:disabled{background:var(--bg);color:var(--t3)}.control{min-height:34px;max-width:100%;padding:0 10px;border-radius:var(--r3);border:1px solid var(--line);background:var(--card)}.search{width:220px}.tablebox{overflow:hidden}.tablehead,.tablefoot{padding:12px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:left;white-space:nowrap}th,td{height:44px;padding:6px 10px;border-top:1px solid var(--line)}th{background:var(--bg);color:var(--t2);font-size:var(--text-muted);font-weight:650}td{color:var(--t2)}td strong{color:var(--t1)}tr:hover td{background:var(--bg)}.users{min-width:555px}.docs{min-width:565px}.actions{display:grid;grid-template-columns:60px 60px;gap:6px;justify-content:end}.actions .btn{width:60px;min-height:30px;padding:0;font-size:var(--text-muted)}.actioncol{width:146px;text-align:right}.pop{position:fixed;z-index:5;min-width:144px;background:var(--card);padding:5px;border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--shadow-pop)}.pop button{display:block;border:0;background:none;padding:7px;width:100%;text-align:left;border-radius:var(--r3)}.pop button:hover{background:var(--bg)}.danger-text{color:var(--danger)}.detail-title{align-items:flex-start}.detail-title .mark{width:44px;height:44px}.detail-title p{margin-top:5px}.chat{grid-template-columns:minmax(140px, .38fr) minmax(0,1fr)}.history{display:grid;gap:5px;margin-top:10px}.history button{text-align:left;overflow:hidden;text-overflow:ellipsis;justify-content:flex-start}.messages{display:grid;gap:10px;margin:12px 0}.bubble{padding:10px 12px;border-radius:var(--r2);background:var(--bg);max-width:94%;overflow-wrap:anywhere}.bubble.mine{justify-self:end;background:var(--tint)}.chat form input{min-width:60px}.setting{padding:11px 0;border-top:1px solid var(--line)}.setting:first-of-type{margin-top:8px}.empty{padding:16px 10px;color:var(--t3)}.badge{display:inline-block;width:7px;height:7px;background:var(--brand);border-radius:var(--r3)}dialog{width:min(470px,calc(100% - 32px));border:1px solid var(--line);border-radius:var(--r1);padding:16px;color:var(--t1);background:var(--card);box-shadow:var(--shadow-pop)}dialog::backdrop{background:rgba(15,23,42,.28)}.dialogbody{margin:12px 0;white-space:pre-wrap}.feedback:empty{display:none}.feedback{padding:8px 12px;border-radius:var(--r3);background:var(--tint);color:var(--brand);margin-bottom:10px}
.header-tools{gap:8px;flex:none}.header-bell{position:relative;width:34px;padding:0}.header-bell .badge{position:absolute;top:5px;right:5px}.header-account{padding:3px 8px 3px 4px;border:1px solid var(--line);border-radius:var(--r2);background:var(--card);line-height:1.2}.header-account .avatar{width:28px;height:28px}.header-account .muted{margin-top:2px}
[hidden]{display:none!important} .history .btn{display:block;text-align:left;line-height:32px} .history .btn[aria-current]{background:var(--tint);color:var(--brand);border-color:var(--tint-strong)}
@media(max-width:1000px){.shell{grid-template-columns:172px minmax(0,1fr);gap:16px;padding-inline:12px}.gridcards{grid-template-columns:repeat(2,minmax(0,1fr))}}

<script>
const icons={brand:'<path d="M3 8l9-5 9 5v9l-9 5-9-5zM3 8l9 5 9-5m-9 5v9"/>',home:'<path d="M3 10l9-7 9 7v10H3zM9 20v-6h6v6"/>',chat:'<path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l1.6-3.4A8.5 8.5 0 1 1 21 11.5Z"/><path d="M8 12h.1m3.9 0h.1m3.9 0h.1"/>',folder:'<path d="M3 6h7l2 2h9v11H3z"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c4 4 4 14 0 18-4-4-4-14 0-18Z"/>',bell:'<path d="M5 16h14l-2-3V9a5 5 0 0 0-10 0v4zm5 3a2 2 0 0 0 4 0"/>',settings:'<path d="M4 7h16M4 12h16M4 17h16"/><circle cx="8" cy="7" r="2" style="fill:var(--card)"/><circle cx="15" cy="12" r="2" style="fill:var(--card)"/><circle cx="10" cy="17" r="2" style="fill:var(--card)"/>',user:'<circle cx="12" cy="7" r="3"/><path d="M4 21v-2a5 5 0 0 1 5-5h6a5 5 0 0 1 5 5v2"/>',library:'<path d="M4 4h16v16H4zM8 4v7l2-1.5 2 1.5V4M4 16h16"/>',next:'<path d="m9 5 7 7-7 7"/>',file:'<path d="M6 3h8l4 4v14H6zm8 0v5h4M9 12h6m-6 4h6"/>',plus:'<path d="M12 5v14M5 12h14"/>',dots:'<path d="M5 12h.1m6.9 0h.1m6.9 0h.1" stroke-width="3"/>',upload:'<path d="M12 16V4m-4 4 4-4 4 4M4 16v4h16v-4"/>'};
const icon=(key,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${icons[key]}</svg>`;
const nav=[['dashboard','仪表盘','home'],['chat','AI 对话','chat'],['knowledge','我的知识库','folder'],['public','公开知识库','globe'],['messages','消息通知','bell'],['settings','系统设置','settings'],['users','用户管理','user'],['global','全局知识库','library']];
const books=[{id:'python',name:'Python 学习笔记',kind:'自建',visibility:'私有',owner:'管理员',desc:'语法速查、算法练习和项目复盘。',docs:[['Python 基础速查.md','Markdown','28 KB','已入库','11月24日','涵盖列表、字典、函数和异常处理。示例：用 enumerate 同时获取索引和值。'],['排序算法练习.pdf','PDF','460 KB','已入库','11月23日','记录快速排序和归并排序的实现思路、时间复杂度及边界条件。'],['项目复盘.docx','DOCX','86 KB','待入库','11月21日','记录交付流程、出现的问题和后续改进项。'],['并发与协程.md','Markdown','14 KB','已入库','11月20日','对比线程、进程与协程的使用场景。']]},{id:'http',name:'HTTP 与接口设计',kind:'自建',visibility:'公开',owner:'管理员',desc:'整理协议、状态码和接口设计规范。',docs:[['HTTP 状态码.md','Markdown','12 KB','已入库','11月23日','2xx 表示成功；4xx 表示请求侧错误；5xx 表示服务端错误。'],['API 命名约定.pdf','PDF','210 KB','已入库','11月18日','用复数名词表达资源，通过 HTTP 方法表达操作。']]},{id:'team',name:'测试协作手册',kind:'协作',visibility:'私有',owner:'测试小组',desc:'测试流程、用例模板与缺陷分级约定。',docs:[['回归测试清单.md','Markdown','19 KB','待入库','11月22日','回归范围包含关键路径、权限与数据完整性。']]},{id:'vibe',name:'Vibe Coding 指南',kind:'收藏',visibility:'公开',owner:'开放学习小组',desc:'从需求拆解到代码评审的实操案例。',docs:[['代码评审清单.md','Markdown','16 KB','已入库','11月19日','先确认目标和边界，再核对测试、可读性和异常处理。']]}];
const chats=[['给我写一个快速排序的算法','11月23日',10,'可以用分治法：选择基准值，将其余元素分到两侧，再分别排序。'],['当前知识库的内容是什么','11月23日',4,'这份知识库主要包含 Python 基础、排序练习和项目复盘。'],['这个知识库主要讲什么？','11月19日',8,'示例知识库涵盖协议和接口设计规范。'],['如何区分 401 和 403？','11月18日',6,'401 通常表示缺少有效的身份凭证；403 表示请求被拒绝。']];
const users=[{id:'admin',name:'管理员',role:'超级管理员',date:'2026-08-21',self:true},{id:'uiwalk01',name:'UI 走查样本',role:'普通用户',date:'2026-11-23'},{id:'qwe111111',name:'小橙',role:'普通用户',date:'2026-09-07'},{id:'admin4f',name:'后台运营',role:'管理员',date:'2026-08-29'},{id:'bin12345',name:'内容审核',role:'管理员',date:'2026-08-28'},{id:'note123',name:'学习笔记',role:'普通用户',date:'2026-08-24'}];
const notices=[{title:'邀请你加入测试协作手册',body:'测试小组邀请你查看协作文档。',date:'11月24日',unread:true,book:'team'},{title:'排序算法练习已入库',body:'Python 学习笔记中的文档可以用于检索了。',date:'11月23日',unread:true,book:'python'},{title:'关注的知识库有更新',body:'Vibe Coding 指南更新了代码评审清单。',date:'11月19日',unread:false,book:'vibe'}];
const state={chat:0,extra:[],bookFilter:'全部',docFilter:'全部',noticeFilter:'全部',settings:{notify:true,stream:true}};
const $=id=>document.getElementById(id), safe=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=(to,text,cls='link')=>`<a class="${cls}" href="#${to}">${text}</a>`;
const button=(text,action,cls='',attrs='')=>`<button type="button" class="btn ${cls}" data-do="${action}" ${attrs}>${text}</button>`;

const mark=(key)=>`<span class="mark">${icon(key)}</span>`;

const empty=text=>`<p class="empty">${text}</p>`;
const table=(headers,rows,cls)=>`<div class="scroll" tabindex="0" role="region" aria-label="${headers[0]}表格，可横向查看"><table class="${cls}"><thead><tr>${headers.map(h=>`<th scope="col"${h==='操作'?' class="actioncol"':''}>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
const filter=(values,active,name)=>`<div class="row wrap">${values.map(v=>button(v,`${name}:${v}`,'',`aria-pressed="${v===active}"`)).join('')}</div>`;
const openBook=(book,from)=>`book/${book.id}/${from}`;
let route='dashboard',origin='knowledge',book=null,pop=null,popAnchor=null;
function renderNav(){const active=route==='book'?origin:route;const unread=notices.filter(n=>n.unread).length;const bell=$('headerBell');bell.innerHTML=icon('bell')+(unread?'<span class="badge" aria-hidden="true"></span>':'');bell.setAttribute('aria-label',unread?`消息通知，${unread} 条未读`:'消息通知');const item=([id,label,key])=>`<a class="nav" href="#${id}" ${id===active?'aria-current="page"':''}>${icon(key)}<span>${label}</span>${id==='messages'&&unread?`<span class="count" aria-label="${unread} 条未读">${unread}</span>`:''}</a>`;$('primaryNav').innerHTML=nav.slice(0,6).map(item).join('');$('adminNav').innerHTML=nav.slice(6).map(item).join('');}
function dashboard(){const unread=notices.filter(n=>n.unread).length;return `<section class="card welcome row between"><div><div class="muted">工作台 / 概览</div><h2>管理员，晚上好</h2></div><div class="stamp"><strong>11月24日</strong><div class="muted">星期二</div></div></section><div class="stats">${[['知识库',books.length,'folder','knowledge'],['最近会话',chats.length,'chat','chat'],['未读通知',unread,'bell','messages'],['协作中',1,'library','knowledge']].map(([l,n,i,r])=>`<a class="metric card" href="#${r}"><div><div class="muted">${l}</div><strong>${n}</strong></div>${mark(i)}</a>`).join('')}</div><section class="card"><h2>快捷入口</h2><div class="shortcuts"><a class="shortcut row" href="#chat/new">${mark('chat')}<span class="grow">发起 AI 对话</span>${icon('next')}</a><a class="shortcut row" href="#knowledge/new">${mark('plus')}<span class="grow">新建知识库</span>${icon('next')}</a><a class="shortcut row" href="#public">${mark('globe')}<span class="grow">浏览公开库</span>${icon('next')}</a></div></section><div class="duo"><section class="card">${heading('最近会话',link('chat','查看全部 ›'))}${chats.map(([title,date,count],i)=>`<a class="listlink" href="#chat/${i}"><strong class="ellipsis">${title}</strong><span class="right muted">${date}<br>${count} 条消息</span>${icon('next','chevron')}</a>`).join('')}</section><section class="card">${heading('知识概览',link('knowledge','管理知识库 ›'))}${books.slice(0,4).map(b=>`<a class="listlink" href="#${openBook(b,'knowledge')}"><div class="ellipsis"><strong class="ellipsis">${b.name}</strong><span class="muted">${b.kind}</span></div><span class="muted right">${b.docs.length} 个文档</span>${icon('next','chevron')}</a>`).join('')}</section></div>`;}
function libraries(){const options=route==='knowledge'?['全部','自建','协作','收藏']:['全部','公开','私有'].filter(v=>route!=='public'||v!=='私有');const data=books.filter(b=>(route!=='public'||b.visibility==='公开')&&(state.bookFilter==='全部'||b.kind===state.bookFilter||b.visibility===state.bookFilter));return `<section class="card row between wrap"><div class="row wrap">${filter(options,state.bookFilter,'bookFilter')}<input class="control search" id="bookSearch" aria-label="搜索知识库" placeholder="搜索知识库"></div>${route==='knowledge'?button(`${icon('plus')} 新建知识库`,'create','primary'):''}</section>${route==='global'?`<section class="tablebox">${table(['知识库','所有者','权限','文档数','操作'],data.map(b=>`<tr data-book="${safe(b.name)}"><td><strong>${safe(b.name)}</strong></td><td>${b.owner}</td><td>${pill(b.visibility,b.visibility==='私有'?'neutral':'')}</td><td>${b.docs.length}</td><td class="actioncol">${link(openBook(b,route),'查看详情 ›')}</td></tr>`).join(''),'')}</section>`:`<div class="gridcards">${data.map(b=>`<article class="card kbcard" data-book="${safe(b.name)}"><div class="row">${mark('folder')}<div class="grow"><h2 class="ellipsis" title="${safe(b.name)}">${safe(b.name)}</h2><div class="muted">${b.owner}</div></div></div><div class="row wrap">${pill(route==='public'?b.visibility:b.kind)}${route==='public'?'':pill(b.visibility,'neutral')}</div><p>${b.desc}</p><div class="foot row between"><span class="muted">${b.docs.length} 个文档</span>${link(openBook(b,route),'打开知识库 ›')}</div></article>`).join('')}</div>`}<p class="card empty" id="noBooks" ${data.length?'hidden':''}>没有匹配的知识库</p>`;}
function details(){const manage=origin==='knowledge'&&(book.kind==='自建'||book.kind==='协作');const shown=book.docs.map((d,i)=>({d,i})).filter(({d})=>state.docFilter==='全部'||state.docFilter===d[3]);return `<section class="card row between detail-title"><div class="row">${mark('folder')}<div><div class="row wrap"><h2>${safe(book.name)}</h2>${pill(book.visibility)}${origin==='knowledge'?pill(book.kind,'neutral'):''}</div><div class="muted">${book.owner} · ${book.docs.length} 个文档 · ${book.docs.filter(d=>d[3]==='已入库').length} 个已入库</div><p>${book.desc}</p></div></div><div class="row wrap">${button('AI Wiki','wiki')}${manage?button(`${icon('upload')} 上传文档`,'upload','primary'):''}</div></section><section class="tablebox"><div class="tablehead row between wrap"><h2>文档列表</h2>${filter(['全部','已入库','待入库'],state.docFilter,'docFilter')}</div>${shown.length?table(['文档名称','类型','大小','向量状态','上传日期','操作'],shown.map(({d,i})=>`<tr><td><strong>${d[0]}</strong></td><td>${d[1]}</td><td>${d[2]}</td><td>${pill(d[3],d[3]==='待入库'?'neutral':'')}</td><td>${d[4]}</td><td class="actioncol">${button('预览',`doc:${i}`)}</td></tr>`).join(''),'docs'):empty('没有匹配的文档')}</section>`;}
function chat(){const current=chats[state.chat];return `<div class="duo chat"><section class="card"><div class="row between wrap"><h2>会话</h2>${link('chat/new','＋ 新建')}</div><div class="history">${chats.map(([title],i)=>`<a class="btn ellipsis" href="#chat/${i}" ${state.chat===i?'aria-current="true"':''} title="${safe(title)}">${safe(title)}</a>`).join('')}</div></section><section class="card"><div class="row between wrap"><h2 class="grow">${current?current[0]:'新会话'}</h2>${pill('演示模式','neutral')}</div><div class="messages">${current?`<div class="bubble mine">${current[0]}</div><div class="bubble">${current[3]}</div>`:'<div class="bubble">你好，输入问题开始对话。</div>'}${state.extra.map(t=>`<div class="bubble mine">${safe(t)}</div><div class="bubble">已收到。原型不调用 AI 接口。</div>`).join('')}</div><form id="chatForm" class="row wrap"><input class="control grow" name="question" required aria-label="问题" placeholder="输入问题…"><button class="btn primary">发送</button></form></section></div>`;}
function notifications(){const shown=notices.map((n,i)=>({n,i})).filter(({n})=>state.noticeFilter==='全部'||n.unread);return `<section class="card"><div class="row between wrap sectionhead">${filter(['全部','未读'],state.noticeFilter,'noticeFilter')}${button('全部标为已读','readAll')}</div>${shown.map(({n,i})=>`<div class="listlink"><div><strong>${n.unread?'<span class="badge" aria-label="未读"></span> ':''}${n.title}</strong><span class="muted">${n.body}</span></div><div class="right muted">${n.date}<br>${button('查看',`notice:${i}`)}</div><span></span></div>`).join('')||empty('没有未读通知')}</section>`;}
function settings(){return `<section class="card"><h2>偏好设置</h2><label class="setting row between"><span><strong>消息提醒</strong><br><span class="muted">接收协作邀请和文档通知</span></span><input type="checkbox" data-setting="notify" ${state.settings.notify?'checked':''}></label><label class="setting row between"><span><strong>流式输出</strong><br><span class="muted">AI 对话逐步显示回复</span></span><input type="checkbox" data-setting="stream" ${state.settings.stream?'checked':''}></label><div class="row end">${button('保存设置','save','primary')}</div></section>`;}
function userRows(list){return list.length?list.map(u=>`<tr><td><strong>${u.id}</strong></td><td>${u.name}</td><td>${pill(u.role,u.role==='普通用户'?'neutral':'')}</td><td>${pill(u.deleted?'已删除':'正常',u.deleted?'neutral':'')}</td><td>${u.date}</td><td><div class="actions">${u.self?'<button class="btn" disabled>本账号</button><button class="btn" disabled aria-label="当前账号无更多操作">—</button>':`${button('管理',`manage:${u.id}`)}${button(`更多 ${icon('dots')}`,`more:${u.id}`,'','aria-expanded="false"')}`}</div></td></tr>`).join(''):'<tr><td colspan="6">没有匹配的用户</td></tr>';}
function adminUsers(){return `<section class="tablebox"><form id="userForm" class="tablehead row wrap"><input class="control search" name="query" aria-label="搜索账号或昵称" placeholder="搜索账号 / 昵称"><select class="control" name="status" aria-label="状态"><option value="active">正常用户</option><option value="all">全部状态</option><option value="deleted">已删除</option></select><button class="btn primary">查询</button></form>${table(['账号','昵称','角色','状态','注册日期','操作'],userRows(users.filter(u=>!u.deleted)),'users')}<div class="tablefoot muted right" id="userTotal">共 ${users.filter(u=>!u.deleted).length} 条</div></section>`;}
function showDialog(title,content){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=content;$('dialog').showModal();}
function flash(text){$('feedback').textContent=text;}
function render(){renderNav();const navTitle=nav.find(n=>n[0]===(route==='book'?origin:route))[1];$('crumb').innerHTML=route==='book'?`${link(origin,navTitle)}${icon('next','chevron')}<h1>知识库详情</h1>`:`<h1>${navTitle}</h1>`;$('page').innerHTML=({dashboard,chat,knowledge:libraries,public:libraries,messages:notifications,settings,users:adminUsers,global:libraries,book:details})[route]();}
function readRoute(){const [next,sub,from]=location.hash.slice(1).split('/');route=nav.some(n=>n[0]===next)||next==='book'?next:'dashboard';origin=['knowledge','public','global'].includes(from)?from:'knowledge';book=route==='book'?books.find(b=>b.id===sub):null;if(route==='book'&&!book)route='knowledge';state.bookFilter=state.docFilter='全部';state.noticeFilter='全部';if(route==='chat'){state.chat=sub==='new'?-1:(chats[sub]?Number(sub):0);state.extra=[];}closeMenu();flash('');render();if(route==='knowledge'&&sub==='new')createDialog();}
function closeMenu(restore=false){if(pop){pop.remove();popAnchor.setAttribute('aria-expanded','false');if(restore)popAnchor.focus();pop=null;popAnchor=null;}}
function more(id,anchor){const u=users.find(x=>x.id===id);pop=document.createElement('div');pop.className='pop';pop.setAttribute('aria-label',`账号 ${u.id} 的更多操作`);pop.innerHTML=u.deleted?'<button type="button" data-do="restore:'+id+'">恢复账号</button>':`<button type="button" data-do="role:${id}">${u.role==='管理员'?'设为普通用户':'设为管理员'}</button><button type="button" class="danger-text" data-do="delete:${id}">删除账号</button>`;document.body.append(pop);popAnchor=anchor;anchor.setAttribute('aria-expanded','true');const r=anchor.getBoundingClientRect();pop.style.left=`${Math.max(4,Math.min(r.right-pop.offsetWidth,innerWidth-pop.offsetWidth-4))}px`;pop.style.top=`${Math.max(4,r.bottom+pop.offsetHeight+5<=innerHeight?r.bottom+4:r.top-pop.offsetHeight-4)}px`;pop.querySelector('button').focus();}
function createDialog(){showDialog('新建知识库','<form id="bookForm" class="row wrap"><input required maxlength="36" name="name" class="control grow" aria-label="知识库名称" placeholder="输入知识库名称"><button class="btn primary">创建示例</button></form>');}
function updateUsers(){const form=$('userForm');const query=form.elements.query.value.trim().toLowerCase(), status=form.elements.status.value;const matches=users.filter(u=>(status==='all'||(status==='deleted'?u.deleted:!u.deleted))&&`${u.id} ${u.name}`.toLowerCase().includes(query));$('page').querySelector('tbody').innerHTML=userRows(matches);$('userTotal').textContent=`共 ${matches.length} 条`;}
$('logoIcon').innerHTML=icon('brand');
window.addEventListener('hashchange',readRoute);window.addEventListener('resize',()=>closeMenu());window.addEventListener('scroll',()=>closeMenu(),true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pop){e.preventDefault();closeMenu(true);}});
document.addEventListener('click',e=>{const control=e.target.closest('[data-do]');const toggled=control&&control===popAnchor;closeMenu(toggled);if(!control||toggled)return;const [action,arg]=control.dataset.do.split(':');
if(['bookFilter','docFilter','noticeFilter'].includes(action)){state[action]=arg;render();[...$('page').querySelectorAll('[data-do]')].find(b=>b.dataset.do===control.dataset.do)?.focus();}
if(action==='create')createDialog();
if(action==='doc')showDialog(book.docs[arg][0],safe(book.docs[arg][5]));
if(action==='wiki')showDialog('AI Wiki · '+book.name,book.docs.length?book.docs.map(d=>`• ${safe(d[0])}`).join('\n'):'暂无可展示的文档。');
if(action==='upload')showDialog('上传文档','原型只展示上传入口，不会上传文件。');
if(action==='readAll'){notices.forEach(n=>n.unread=false);render();$('page').querySelector('[data-do="readAll"]').focus();flash('通知已全部标为已读。');}
if(action==='notice'){notices[arg].unread=false;location.hash=openBook(books.find(b=>b.id===notices[arg].book),'knowledge');}
if(action==='save')flash('偏好已在当前原型会话中保存。');
if(action==='more')more(arg,control);
if(action==='manage'){const u=users.find(x=>x.id===arg);showDialog('账号信息',`账号：${u.id}\n昵称：${u.name}\n角色：${u.role}\n状态：${u.deleted?'已删除':'正常'}`);}
if(action==='role'){const u=users.find(x=>x.id===arg);showDialog('调整角色',`<p>将 ${arg} 调整为${u.role==='管理员'?'普通用户':'管理员'}？</p><br>${button('确认调整',`roleConfirm:${arg}`,'primary')}`);}
if(action==='delete')showDialog('删除示例账号',`<p>确认将 ${arg} 标为已删除？此操作仅影响当前原型。</p><br>${button('确认删除',`deleteConfirm:${arg}`)}`);
if(['deleteConfirm','restore','roleConfirm'].includes(action)){const u=users.find(x=>x.id===arg);if(action==='roleConfirm')u.role=u.role==='管理员'?'普通用户':'管理员';else u.deleted=action==='deleteConfirm';if($('dialog').open)$('dialog').close();updateUsers();$('userForm').querySelector('button').focus();flash('示例状态已更新，未连接后台。');}
});
document.addEventListener('submit',e=>{const form=e.target;if(form.id==='userForm'){e.preventDefault();updateUsers();}if(form.id==='chatForm'){e.preventDefault();const text=form.elements.question.value.trim();if(text){state.extra.push(text);render();$('chatForm').elements.question.focus();}}if(form.id==='bookForm'){e.preventDefault();const name=form.elements.name.value.trim();if(!name)return;const b={id:`demo-${books.length}`,name,kind:'自建',visibility:'私有',owner:'管理员',desc:'演示新建的知识库。',docs:[]};books.push(b);$('dialog').close();location.hash=openBook(b,'knowledge');}});
document.addEventListener('input',e=>{if(e.target.id==='bookSearch'){const q=e.target.value.trim().toLowerCase();const entries=[...$('page').querySelectorAll('[data-book]')];entries.forEach(x=>x.hidden=!x.dataset.book.toLowerCase().includes(q));$('noBooks').hidden=entries.some(x=>!x.hidden);}if(e.target.dataset.setting)state.settings[e.target.dataset.setting]=e.target.checked;});
readRoute();
</script>
</body>
</html>
