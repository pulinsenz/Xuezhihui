# 当 Docker Hub / quay.io 直连失败时与本文件一并使用（DaoCloud 公共镜像代理示例）：
#
#   docker compose -f docker-compose.yml -f docker-compose.pull-mirror.yml up -d --build
#
# 亦可自行改前缀或配置 Docker Desktop 的 registry-mirrors，不以本仓库为唯一方案。
# 覆盖文件中 etcd 仍为 quay.io 官方镜像：DaoCloud 对 quay/etcd 路径常返回 403。

services:
  # python 基础镜像走 DaoCloud 代理（Dockerfile 通过 PYTHON_IMAGE 构建参数替换）
  python-agent:
    build:
      args:
        PYTHON_IMAGE: docker.m.daocloud.io/library/python:3.12-slim

  # java 构建/运行镜像走 DaoCloud 代理（Dockerfile 通过 MAVEN_IMAGE/JRE_IMAGE 参数替换）
  java-backend:
    build:
      args:
        MAVEN_IMAGE: docker.m.daocloud.io/library/maven:3.9-eclipse-temurin-17
        JRE_IMAGE: docker.m.daocloud.io/library/eclipse-temurin:17-jre

  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine

  # quay.io 经 DaoCloud 代理常返回 403，此处沿用官方镜像（通常可直连）
  etcd:
    image: quay.io/coreos/etcd:v3.5.14

  # tag 与基文件 docker-compose.yml 保持一致（只换镜像源，不改版本）
  minio:
    image: docker.m.daocloud.io/minio/minio:RELEASE.2024-08-03T04-33-23Z

  milvus:
    image: docker.m.daocloud.io/milvusdb/milvus:v2.4.4

  # 前端构建/运行镜像走 DaoCloud 代理
  frontend:
    build:
      args:
        NODE_IMAGE: docker.m.daocloud.io/library/node:22-alpine
        NGINX_IMAGE: docker.m.daocloud.io/library/nginx:1.27-alpine
