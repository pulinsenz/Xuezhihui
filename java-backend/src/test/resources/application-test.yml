# 测试专用 profile 覆盖层（经 @ActiveProfiles("test") 启用，叠加在 main application.yml 之上，不遮蔽主配置）
# 1. Redis 用 db 15：与本地开发 db 0 隔离，避免集成测试的登录计数/锁键污染开发环境
# 2. IP 限流阈值抬高：多个 controller 集成测试的登录全来自 127.0.0.1，默认 20/min 会打爆配额
spring:
  data:
    redis:
      database: 15

# 测试 profile 固定内部鉴权 token（application.yml 已去掉 AGENT_TOKEN 默认值，测试须显式提供）
app:
  agent:
    token: test-agent-token

security:
  login:
    ip-max-per-minute: 1000
  # 对话限流阈值调高：多个 controller 集成测试会注册新账号反复对话，默认 50/30min 会打爆配额。
  # 限流拦截本身由 ChatRateLimitServiceTest 用小阈值（@SpringBootTest properties 覆盖）单独验证
  chat:
    max-count-per-window: 10000
