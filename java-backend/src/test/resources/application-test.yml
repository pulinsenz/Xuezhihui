# 集成测试专用覆盖（@ActiveProfiles("test") 加载，与 application.yml 合并）
# Java↔Python 内部鉴权 token：application.yml 为 fail-closed（${AGENT_TOKEN}，缺失启动失败），
# 测试环境无需真实密钥，注入固定测试值即可（与 AgentData/VectorCallback/ChatCallback 测试内联设置一致）
app:
  agent:
    token: test-agent-token
# 注册/登录 IP 限流：集成测试共享 127.0.0.1，全量套件会产生远超生产单 IP 的注册/登录次数，
# 抬高阈值避免误伤；限流逻辑本身由 LoginAttemptServiceTest/AuthServiceTest 单测覆盖，
# 验证码仍逐一真实校验（CaptchaService + Redis 一次性消费）。生产默认值不变。
security:
  login:
    ip-max-per-minute: 100000
  register:
    ip-max-per-hour: 100000
