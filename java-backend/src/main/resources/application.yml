server:
  port: 8123
  servlet:
    context-path: /api
spring:
  application:
    name: xuezhihui-backend
  #数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/xuezhihui?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 111111
    driver-class-name: com.mysql.cj.jdbc.Driver
  #redis数据库配置
  data:
    redis:
      database: 0
      host: 127.0.0.1
      port: 6379
      timeout: 5000
  #文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
#
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-value: 1 # 逻辑删除字段值
      logic-not-delete-value: 0 # 逻辑未删除字段值
      logic-delete-field: isDeleted # 逻辑删除字段名
# CORS 配置（生产环境请在 application-prod.yml 中配置前端域名）
app:
  cors:
    allowed-origin-patterns:
      - http://localhost:5173
      - http://127.0.0.1:5173
  # Python Agent 服务地址（Feign 调用）+ 内部鉴权 token
  agent:
    base-url: http://localhost:8000
    # 生产用环境变量 AGENT_TOKEN 注入；默认值与 python-agent/.env 一致
    token: ${AGENT_TOKEN:dev-agent-token-change-me}
  # 长任务消息队列（Redis List）：Java 提交，Python worker 消费
  task:
    queue-vectorize: ${TASK_QUEUE_VECTORIZE:xzh:task:vectorize}
  # 本地文件存储路径（对象存储可替换实现）
  file:
    storage:
      local-path: ./data/files
#接口文档配置（生产环境默认关闭，本地开发开启增强模式）
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  api-docs:
    enabled: true
#对象存储配置(从腾讯云获取)
cos:
  client:
    host: ${cos.host}
    secretId: ${cos.secretId}
    secretKey: ${cos.secretKey}
    region: ${cos.region}
    bucket: ${cos.bucket}
#JWT 鉴权配置（密钥通过环境变量注入，不落库；本地在 IntelliJ 运行配置设置 JWT_SECRET）
jwt:
  secret: ${JWT_SECRET}
  expire-hours: 24
  header: Authorization
  token-prefix: "Bearer "
  redis-prefix: "xzh:login:"