# 生产环境配置，启动时加：--spring.profiles.active=prod
app:
  cors:
    allowed-origin-patterns:
      - https://your-frontend-domain.com
knife4j:
  enable: false
# 登录防爆破阈值沿用 application.yml 默认（5次/30分钟窗口/锁15分钟，IP 20次/分钟）。
# 生产可按需覆盖，如 NAT 共享出口 IP 可调大 ip-max-per-minute：
# security:
#   login:
#     max-fail-count: 5
#     lock-minutes: 15
#     ip-max-per-minute: 50
