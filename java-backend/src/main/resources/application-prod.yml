# 生产环境配置，启动时加：--spring.profiles.active=prod
app:
  cors:
    allowed-origin-patterns:
      - https://xuezhihui.site
      - https://www.xuezhihui.site
      # 不再允许 http://xuezhihui.site 明文源：allowCredentials(true) 下明文源
      # 会把凭证暴露给非 TLS 连接（站点已 301 强制 HTTPS，明文白名单无存在必要）
mybatis-plus:
  configuration:
    # SQL 日志仅本地开发（application.yml 的 StdOutImpl）开启，生产静默
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
knife4j:
  enable: false
# 生产彻底关闭 OpenAPI 文档：只关 knife4j 时 springdoc 的 /v3/api-docs 仍会无鉴权暴露全部接口地图
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
# 登录防爆破阈值沿用 application.yml 默认（5次/30分钟窗口/锁15分钟，IP 20次/分钟）。
# 生产可按需覆盖，如 NAT 共享出口 IP 可调大 ip-max-per-minute：
# security:
#   login:
#     max-fail-count: 5
#     lock-minutes: 15
#     ip-max-per-minute: 50
