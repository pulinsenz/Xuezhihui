# frontend-v2 Nginx 站点（HTTP 8080 端口，独立于老前端 80/443；职责同老 nginx.conf）
# 三条铁律沿用老配置注释：
#   1) /api/ 反代 proxy_pass 不带 URI → 保留原始完整路径
#   2) SSE /api/chat/stream：proxy_buffering off + HTTP/1.1 + 清空 Connection 头
#   3) client_max_body_size > 后端 multipart 10MB
# Docker DNS 缓存坑同理：resolver 127.0.0.11 + 变量，容器重建 IP 变化后 nginx 动态解析。

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $java_upstream http://java-backend:8123;
        proxy_pass $java_upstream;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_connect_timeout 5s;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Accel-Buffering no;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
