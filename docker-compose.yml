# 学智汇 多 Agent 协同 RAG 系统 一键编排
# 用法：
#   1. cp .env.example .env 并填写 DEEPSEEK_API_KEY / AGENT_TOKEN / JWT_SECRET
#   2. docker compose up -d --build                                    # 开发/本地全量
#      docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build  # 生产：对外仅 80
#
# 说明：agent 服务生产默认 VECTOR_STORE=milvus（持久化向量库）

services:
  # ---------------- 中间件 ----------------
  mysql:
    image: mysql:8.0
    container_name: xzh-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-111111}
      MYSQL_DATABASE: xuezhihui
    ports:
      # 宿主 3307（避开本机 MySQL 的 3306；容器间仍走 mysql:3306）；生产由 prod override 关闭
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./java-backend/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: xzh-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: xzh-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd-data:/etcd

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    container_name: xzh-minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.4
    container_name: xzh-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - etcd
      - minio

  # ---------------- 应用 ----------------
  java-backend:
    build: ./java-backend
    container_name: xzh-java
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/xuezhihui?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-111111}
      SPRING_DATA_REDIS_HOST: redis
      APP_AGENT_BASE_URL: http://python-agent:8000
      APP_AGENT_TOKEN: ${AGENT_TOKEN}
      # 腾讯云 COS（封面对象存储）：映射 application.yml 的 cos.client.* 占位符
      COS_HOST: ${COS_HOST:-}
      COS_SECRETID: ${COS_SECRETID:-}
      COS_SECRETKEY: ${COS_SECRETKEY:-}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_BUCKET: ${COS_BUCKET:-}
    volumes:
      # 上传文件与 python-agent 共享（生产可换 COS 对象存储）
      - file-data:/app/data/files
    ports:
      - "8123:8123"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # temurin:17-jre 自带 bash（无 curl/wget、pom 无 actuator），用 bash /dev/tcp 探测 8123；
      # Tomcat 监听 = JVM 已起且启动期连 MySQL 成功（Hikari 启动即初始化，连不上会启动失败）
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8123'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  python-agent:
    build: ./python-agent
    container_name: xzh-python-agent
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      # 普通用户 LLM：独立密钥（必填）+ 独立模型/地址（走内部代理网关；:- 缺省注入，避免空串覆盖 Python 默认值）
      USER_API_KEY: ${USER_API_KEY}
      USER_LLM_MODEL: ${USER_LLM_MODEL:-deepseek-v4-flash-0731}
      USER_LLM_BASE_URL: ${USER_LLM_BASE_URL:-http://101.43.101.178:8080/v1}
      AGENT_TOKEN: ${AGENT_TOKEN}
      VECTOR_STORE: milvus
      MILVUS_URI: http://milvus:19530
      REDIS_HOST: redis
      LOG_LEVEL: INFO
      # 回调 Java（vector-callback/chat-save/user-stats）：config.py 默认 localhost 在容器内指向自身，
      # 必须显式指到 java 服务名；本机混合场景（Java 在宿主机）可在 .env 覆盖为 http://host.docker.internal:8123/api
      JAVA_BASE_URL: ${JAVA_BASE_URL:-http://java-backend:8123/api}
      # embedding 模型（BAAI/bge-small-zh-v1.5 ~130MB）走官方 HF：实测新版 huggingface_hub
      # 对 hf-mirror.com 的 HEAD 元数据校验失败（FileMetadataError），而 huggingface.co 可直连；
      # 模型已持久化到 hf-cache 卷，仅首启下载一次
    volumes:
      # 读取 Java 上传的文件（共享卷）
      - file-data:/app/data/files
      # embedding 模型缓存持久化：容器重建后不重复下载 ~130MB（agentuser 的 HOME 是 /home/agentuser）
      - hf-cache:/home/agentuser/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      - milvus
      - redis
    healthcheck:
      # /health 免鉴权（main.py 中间件豁免）；用 python 标准库 urllib 探测（镜像无 curl/wget）
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s

  # 前端：Nginx 托管 Vite 产物，对外唯一入口 :80（生产由 prod override 收敛端口）
  frontend:
    build: ./frontend
    container_name: xzh-frontend
    ports:
      - "80:80"
    depends_on:
      java-backend:
        condition: service_healthy
    healthcheck:
      # nginx:alpine 自带 busybox wget，探测 nginx.conf 内定义的 /healthz
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mysql-data:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
  file-data:
  hf-cache:
